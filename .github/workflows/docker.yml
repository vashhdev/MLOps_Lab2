name: Docker build and push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_DIR: 3D_Maze_Game_Agent_Codebase
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/maze-rl-agent

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once and load into the runner's local Docker so we can test and export it
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          tags: |
            maze-rl-agent:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name maze -p 8080:8080 maze-rl-agent:ci
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/ | grep -q "3D Maze RL"; then
              echo "Container is serving the app"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not respond in time"
          docker logs maze
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f maze || true

      # Same as the lab's "docker save" step, kept as a downloadable workflow artifact
      - name: Export image to tar
        run: docker save maze-rl-agent:ci -o maze-rl-agent.tar

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: maze-rl-agent-image
          path: maze-rl-agent.tar
          retention-days: 7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers come from the gha cache, so this does not rebuild from scratch
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
